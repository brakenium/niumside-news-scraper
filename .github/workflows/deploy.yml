name: Deploy PlanetSide 2 archive

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - img/**
      - data/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages
        run: |
          mkdir -p _site

          cp index.html _site/index.html

          cp data/news.json _site/news.json
          cp data/patch-notes.json _site/patch-notes.json

          mkdir -p _site/archive

          cp data/archive/news.json _site/archive/news.json
          cp data/archive/patch-notes.json _site/archive/patch-notes.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
